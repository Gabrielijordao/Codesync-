name: Checkpoint3 - API Tests
on:
  push:
  pull_request:
jobs:
  unit-and-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Assim que gerar package-lock.json, substitua npm install por npm ci.
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run integrity
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-jest
          path: coverage/
          if-no-files-found: ignore
